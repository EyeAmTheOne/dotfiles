[main]
# Use a clean system font
font=Noto Sans:size=14
# Center the prompt on your screen
anchor=center

# Forces fuzzel to look like a tiny, single-line input bar
lines=0
width=40
tabs=4
horizontal-pad=20
vertical-pad=15
inner-pad=10

[colors]
# Format is HEX plus opacity (RRGGBBAA)
background=1e222aff
text=abb2bf ff
prompt=61afefff
border=4b5263ff

[border]
width=2
radius=8

